definitions:
  handle.Response:
    properties:
      code:
        description: 响应码，0 表示成功
        example: 0
        type: integer
      data:
        description: 响应数据（可选）
      message:
        description: 响应消息（可选）
        example: 操作成功
        type: string
    type: object
  user.GetUserInfoResp:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      nick_name:
        example: 爱丽丝
        type: string
      user_id:
        description: 用户基本信息
        example: 1
        type: integer
      username:
        example: alice123
        type: string
    type: object
  user.LoginReq:
    properties:
      password:
        example: password123
        maxLength: 16
        minLength: 8
        type: string
      username:
        example: alice123
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  user.LoginResp:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  user.RefreshTokenReq:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  user.RefreshTokenResp:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 这是一个基于 Go 和 Gin 框架的 API 服务
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Backend API
  version: "1.0"
paths:
  /api/user/info:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的基本信息和菜单列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.GetUserInfoResp'
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/handle.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - 用户认证
  /api/user/login:
    post:
      consumes:
      - application/json
      description: 使用用户名、密码和验证码进行登录，返回访问令牌和刷新令牌
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.LoginResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handle.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 用户登录
      tags:
      - 用户认证
  /api/user/refresh-token:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌和刷新令牌
      parameters:
      - description: 刷新令牌请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.RefreshTokenResp'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/handle.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 刷新访问令牌
      tags:
      - 用户认证
schemes:
- http
- https
swagger: "2.0"
